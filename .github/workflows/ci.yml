name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly run on main: new advisories are published without any code change (M1-03).
  schedule:
    - cron: '0 3 * * 1'

# A newer push to the same PR cancels its older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Branch protection (M1-05) requires this job by name; keep it `lint`.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Lint does not need the MongoDB binary that mongodb-memory-server downloads on install.
      MONGOMS_DISABLE_POSTINSTALL: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  # Known vulnerabilities in dependencies (SEC-11). Branch protection (M1-05) requires this job by
  # name; keep it `audit`.
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Reads package-lock.json only (all workspaces), so no `npm ci` is needed. High and critical
      # advisories fail the job; lower severities are listed but do not.
      - name: npm audit
        run: npm audit --audit-level=high

  # Unit, component, and integration tests with coverage thresholds (set in each vitest.config.js).
  # Branch protection (M1-05) requires this job by name; keep it `test`.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The API integration tests use mongodb-memory-server. Keep its binary outside node_modules
      # (which `npm ci` wipes) so it can be cached, keyed by the version pinned in apps/api.
      - name: Locate MongoDB binary cache
        id: mongodb
        run: |
          echo "MONGOMS_DOWNLOAD_DIR=$HOME/.cache/mongodb-binaries" >> "$GITHUB_ENV"
          echo "version=$(node -p "require('./apps/api/package.json').config.mongodbMemoryServer.version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-${{ runner.os }}-${{ steps.mongodb.outputs.version }}

      # Downloads the MongoDB binary in postinstall only on a cache miss.
      - run: npm ci

      # One step per workspace; `!cancelled()` runs them all even if an earlier one fails.
      - name: packages/shared
        if: ${{ !cancelled() }}
        run: npm run test:coverage -w packages/shared

      - name: apps/api
        if: ${{ !cancelled() }}
        run: npm run test:coverage -w apps/api

      - name: apps/store
        if: ${{ !cancelled() }}
        run: npm run test:coverage -w apps/store

      - name: apps/admin
        if: ${{ !cancelled() }}
        run: npm run test:coverage -w apps/admin

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.js >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            packages/shared/coverage/
            apps/*/coverage/
          if-no-files-found: warn
          retention-days: 14

  # Playwright end-to-end tests, after the faster checks pass (SRS 8.4). Playwright starts the store
  # and admin dev servers and the API; the API uses the MongoDB and Redis service containers.
  # Branch protection (M1-05) requires this job by name; keep it `e2e`.
  e2e:
    name: e2e
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # MongoDB comes from the service container; the memory-server binary is not needed.
      MONGOMS_DISABLE_POSTINSTALL: '1'
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Browsers are cached by Playwright version; their OS libraries are not, so a cache hit
      # still installs those.
      - name: Locate Playwright browser cache
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install browser system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      - name: Playwright
        run: npm run test:e2e

      # Failed tests are retried with a trace (trace: 'on-first-retry'); open one with
      # `npx playwright show-trace <trace.zip>`.
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: warn
          retention-days: 14
