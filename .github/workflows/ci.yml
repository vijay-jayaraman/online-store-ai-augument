name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels its older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Branch protection (M1-05) requires this job by name; keep it `lint`.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Lint does not need the MongoDB binary that mongodb-memory-server downloads on install.
      MONGOMS_DISABLE_POSTINSTALL: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check
